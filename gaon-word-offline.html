</script>
<style>
/* Layout: one-screen app. App bar, toolbar, context bar, then a desk that holds an A4 sheet, then a status bar. */
:root {
  --desk: #e3e6e1;
  --chrome: #f7f8f5;
  --chrome-2: #eceee9;
  --line: #cdd3cb;
  --text: #1d2321;
  --muted: #5b6661;
  --accent: #23615d;
  --accent-ink: #ffffff;
  --accent-soft: #d5e7e3;
  --danger: #a33a2c;
  --shadow: rgba(24, 36, 33, 0.16);
  /* Paper stays white in both themes, like a printed sheet. */
  --paper: #ffffff;
  --ink: #000000;
  --page-rule: #dcdfda;
  --ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #141918; --chrome: #1e2321; --chrome-2: #262c2a; --line: #39423f;
    --text: #e2e8e5; --muted: #9aa6a1; --accent: #7fc3ba; --accent-ink: #0d1a18;
    --accent-soft: #263c39; --danger: #f08a7a; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #141918; --chrome: #1e2321; --chrome-2: #262c2a; --line: #39423f;
  --text: #e2e8e5; --muted: #9aa6a1; --accent: #7fc3ba; --accent-ink: #0d1a18;
  --accent-soft: #263c39; --danger: #f08a7a; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--desk); color: var(--text); font-family: var(--ui); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }

.app { height: 100%; display: grid; grid-template-rows: auto auto auto 1fr auto; min-height: 0; }

/* App bar */
.appbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--chrome); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.mark {
  width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-size: 14px; font-weight: 600;
}
.docname {
  flex: 1 1 180px; min-width: 0; max-width: 420px; border: 1px solid transparent; background: transparent;
  padding: 5px 8px; border-radius: 6px; font-size: 15px;
}
.docname:hover { border-color: var(--line); }
.docname:focus { outline: none; border-color: var(--accent); background: var(--paper); color: #111; }
.sample-chip {
  font-size: 11px; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 99px;
  background: var(--accent-soft); color: var(--text); white-space: nowrap;
}
.filebtns { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--chrome); cursor: pointer; white-space: nowrap; font-size: 13px;
}
.btn:hover { background: var(--chrome-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn svg { width: 16px; height: 16px; }
.split { display: inline-flex; }
.split .btn:first-child { border-radius: 7px 0 0 7px; }
.split .btn:last-child { border-radius: 0 7px 7px 0; border-left: 1px solid rgba(255,255,255,0.35); padding: 0 6px; }

/* Toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--chrome); border-bottom: 1px solid var(--line);
}
.group { display: flex; align-items: center; gap: 2px; padding-right: 4px; margin-right: 3px; border-right: 1px solid var(--line); }
.group:last-child { border-right: 0; }
.tb {
  min-width: 30px; height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; cursor: pointer; display: inline-grid; place-items: center; font-size: 14px; position: relative;
}
.tb:hover { background: var(--chrome-2); }
.tb[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb .glyph { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1; }
.colorbtn { display: inline-flex; align-items: center; }
.colorbtn .swatchwrap { display: grid; justify-items: center; gap: 1px; }
.colorbtn .bar { width: 16px; height: 4px; border-radius: 1px; }
.colorbtn input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.sel {
  height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--chrome); padding: 0 4px; font-size: 13px;
}
#styleSel { width: 84px; } #fontSel { width: 116px; } #sizeSel { width: 62px; } #lineSel { width: 70px; }
.tb:focus-visible, .btn:focus-visible, .sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Context bar */
.ctxbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px;
}
.ctxbar .label { font-weight: 600; margin-right: 4px; }
.ctxbar .btn { height: 28px; padding: 0 10px; font-size: 12.5px; }
.ctxbar input[type=range] { width: 140px; accent-color: var(--accent); }

/* Desk and page */
.desk {
  overflow: auto; min-height: 0; position: relative;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.zoomwrap { width: max-content; margin: 0 auto; }
.doc {
  width: 210mm; min-height: 297mm; padding: 25.4mm;
  background-color: var(--paper); color: var(--ink);
  box-shadow: 0 1px 2px var(--shadow), 0 8px 28px var(--shadow);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(297mm - 1px), var(--page-rule) calc(297mm - 1px), var(--page-rule) 297mm);
  outline: none; caret-color: #000;
}
.desk.dragover .doc { box-shadow: 0 0 0 3px var(--accent), 0 8px 28px var(--shadow); }
.doc img.selected { outline: 2px solid #2b6cb0; outline-offset: 2px; }

@media (max-width: 860px) {
  .zoomwrap { width: 100%; }
  .doc { width: 100%; min-height: 70vh; padding: 20px 18px; background-image: none; }
}
@media (max-width: 640px) {
  .toolbar { flex-wrap: nowrap; overflow-x: auto; }
  .group { flex: none; }
  .brand .name { display: none; }
  .btn .lbl { display: none; }
  .saved-note { display: none; }
  .desk { padding-block: 12px 32px; }
}

/* Status bar */
.status {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
  padding-block: 5px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--chrome); border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.status .grow { flex: 1; }
.status .sel { height: 24px; font-size: 12px; }
.saved-note { white-space: nowrap; }

/* Find panel */
.findpanel {
  position: absolute; top: 10px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  box-shadow: 0 8px 24px var(--shadow); display: grid; gap: 8px; width: min(340px, calc(100% - 32px));
}
.findpanel .row { display: flex; gap: 6px; align-items: center; }
.findpanel input[type=text] {
  flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--paper); color: #111;
}
.findpanel .btn { height: 28px; padding: 0 9px; font-size: 12.5px; }
.findpanel .count { font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

/* Popovers, dialogs, toast */
.pop {
  position: fixed; z-index: 30; background: var(--chrome); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px var(--shadow); padding: 8px;
}
.menu { display: grid; min-width: 200px; }
.menu button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--chrome-2); outline: none; }
.menu small { display: block; color: var(--muted); font-size: 11.5px; }
.grid-picker { display: grid; grid-template-columns: repeat(8, 18px); gap: 3px; }
.grid-picker span { width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); cursor: pointer; }
.grid-picker span.on { background: var(--accent-soft); border-color: var(--accent); }
.grid-label { text-align: center; font-size: 12px; margin-top: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; display: grid; place-items: center; padding: 16px; }
.dialog {
  background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(420px, 100%);
  box-shadow: 0 20px 50px var(--shadow); display: grid; gap: 12px;
}
.dialog h2 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
.dialog p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
.dialog label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
.dialog input { height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--paper); color: #111; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast {
  position: fixed; left: 50%; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--text); color: var(--chrome); padding: 9px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 8px 24px var(--shadow); max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 6px); opacity: 0.4; } }
}
@media print {
  .appbar, .toolbar, .ctxbar, .status, .findpanel { display: none !important; }
  body { overflow: visible; background: #fff; }
  .app { display: block; } .desk { overflow: visible; padding: 0; }
  .doc { box-shadow: none; background-image: none; width: auto; min-height: 0; padding: 0; }
  .doc .pb { break-after: page; border: 0; } .doc .pb::after { display: none; }
}

// Heading defaults shared by the on-screen CSS and the exported styles.xml (sizes in half-points).
const HEADINGS = {
  H1: { hp: 32, color: '2F5496', before: 240, after: 0, italic: false },
  H2: { hp: 26, color: '2F5496', before: 40, after: 0, italic: false },
  H3: { hp: 24, color: '1F3763', before: 40, after: 0, italic: false },
  H4: { hp: 22, color: '2F5496', before: 40, after: 0, italic: true },
  H5: { hp: 22, color: '2F5496', before: 40, after: 0, italic: false },
  H6: { hp: 22, color: '1F3763', before: 40, after: 0, italic: false },
};

function canonicalFont(name) {
  const n = String(name || '').trim().replace(/^['"]|['"]$/g, '');
  const alias = FONT_ALIASES[n.toLowerCase()];
  if (alias) return alias;
  const hit = FONTS.find(f => f[0].toLowerCase() === n.toLowerCase());
  return hit ? hit[0] : n;
}
function fontStack(name) {
  const c = canonicalFont(name);
  const hit = FONTS.find(f => f[0] === c);
  return hit ? hit[1] : `'${c.replace(/'/g, '')}',${FONTS[0][1]}`;
}
function firstFamily(css) { return canonicalFont(String(css || '').split(',')[0]); }

/* Document CSS: used on screen and embedded in HTML exports. */

/* ============================================================
   Small helpers
   ============================================================ */
function toast(msg, ms = 2600) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const htmlEsc = xmlEsc;
function rgbToHex(c) {
  if (!c) return null;
  if (c[0] === '#') { let h = c.slice(1); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return h.toUpperCase(); }
  const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return null;
  const p = m[1].split(/[ ,/]+/).filter(Boolean).map(Number);
  if (p.length > 3 && p[3] === 0) return null;
  return p.slice(0, 3).map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
}
function cssLenToPx(v) {
  if (!v) return 0; const n = parseFloat(v); if (isNaN(n)) return 0;
  if (v.endsWith('pt')) return n * 96 / 72; if (v.endsWith('cm')) return n * 96 / 2.54; if (v.endsWith('mm')) return n * 96 / 25.4;
  if (v.endsWith('in')) return n * 96; if (v.endsWith('em')) return n * 14.67; return n;
}
const BLOCK = new Set(['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'UL', 'OL', 'LI', 'TABLE', 'BLOCKQUOTE', 'PRE', 'HR', 'SECTION', 'ARTICLE', 'HEADER', 'FOOTER', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TD', 'TH', 'FIGURE', 'ADDRESS', 'MAIN', 'NAV', 'ASIDE', 'DL', 'DT', 'DD', 'CAPTION']);
const isBlock = n => n && n.nodeType === 1 && (BLOCK.has(n.tagName) || n.classList.contains('pb'));
const hasBlockChild = el => [...el.children].some(isBlock);

/* ============================================================
   Selection management
   ============================================================ */
let savedRange = null;
function selInEditor() {
  const s = getSelection(); if (!s.rangeCount) return null;
  const r = s.getRangeAt(0);
  return ed.contains(r.commonAncestorContainer) ? r : null;
}
function saveSel() { const r = selInEditor(); if (r) savedRange = r.cloneRange(); }
function restoreSel() {
  ed.focus({ preventScroll: true });
  if (savedRange && ed.contains(savedRange.commonAncestorContainer)) {
    const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange);
  }
}
function exec(cmd, val = null) { restoreSel(); document.execCommand(cmd, false, val); saveSel(); onChange(); updateState(); }
function currentBlock(node) {
  let n = node && (node.nodeType === 3 ? node.parentNode : node);
  while (n && n !== ed) { if (isBlock(n) && !['UL', 'OL', 'TABLE', 'TBODY', 'THEAD', 'TR'].includes(n.tagName)) return n; n = n.parentNode; }
  return null;
}
function selectedBlocks() {
  const r = savedRange || selInEditor(); if (!r) return [];
  if (r.collapsed) { const b = currentBlock(r.startContainer); return b ? [b] : []; }
  const out = [];
  ed.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,div,pre,td,th').forEach(el => {
    if (hasBlockChild(el)) return;
    if (r.intersectsNode(el)) out.push(el);
  });
  return out;
}

/* Apply an inline CSS property to the selection (font size / family). */
function applyInlineStyle(prop, value) {
  restoreSel();
  const sel = getSelection(); if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (r.collapsed) {
    const span = document.createElement('span'); span.style[prop] = value; span.textContent = '​';
    r.insertNode(span);
    const nr = document.createRange(); nr.setStart(span.firstChild, 1); nr.collapse(true);
    sel.removeAllRanges(); sel.addRange(nr);
  } else {
    document.execCommand('styleWithCSS', false, false);
    document.execCommand('fontSize', false, '7');
    document.execCommand('styleWithCSS', false, true);
    const made = [];
    ed.querySelectorAll('font[size="7"]').forEach(f => {
      const span = document.createElement('span'); span.style[prop] = value;
      f.querySelectorAll('[style]').forEach(x => { x.style[prop] = ''; if (!x.getAttribute('style')) x.removeAttribute('style'); });
      while (f.firstChild) span.appendChild(f.firstChild);
      f.replaceWith(span); made.push(span);
    });
    if (made.length) {
      const nr = document.createRange(); nr.setStartBefore(made[0]); nr.setEndAfter(made[made.length - 1]);
      sel.removeAllRanges(); sel.addRange(nr);
    }
  }
  saveSel(); onChange(); updateState();
}

function indentBlocks(inward) {
  restoreSel();
  const r = selInEditor();
  if (r && r.startContainer && (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentNode).closest('li')) {
    document.execCommand(inward ? 'indent' : 'outdent'); onChange(); return;
  }
  selectedBlocks().forEach(b => {
    const cur = cssLenToPx(b.style.marginLeft);
    const next = Math.max(0, cur + (inward ? 48 : -48));
    b.style.marginLeft = next ? next + 'px' : '';
  });
  onChange();
}

/* Toolbar state */
function updateState() {
  const r = selInEditor();
  if (!r) return;
  ['bold', 'italic', 'underline', 'strikeThrough', 'superscript', 'subscript', 'insertUnorderedList', 'insertOrderedList'].forEach(c => {
    const b = document.querySelector(`[data-cmd="${c}"]`); let v = false;
    try { v = document.queryCommandState(c); } catch (e) {}
    b.setAttribute('aria-pressed', String(!!v));
  });
  const node = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
  const el = node.nodeType === 1 ? node : ed;
  const cs = getComputedStyle(el);
  const fam = firstFamily(cs.fontFamily);
  if (![...fontSel.options].some(o => o.value === fam)) fontSel.add(new Option(fam, fam));
  fontSel.value = fam;
  const pt = Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2;
  if (![...sizeSel.options].some(o => o.value === String(pt))) {
    const o = new Option(String(pt), String(pt));
    const after = [...sizeSel.options].find(x => parseFloat(x.value) > pt); sizeSel.add(o, after || null);
  }
  sizeSel.value = String(pt);
  const blk = currentBlock(r.startContainer);
  const tag = blk ? blk.tagName.toLowerCase() : 'p';
  styleSel.value = [...styleSel.options].some(o => o.value === tag) ? tag : 'p';
  const align = blk ? getComputedStyle(blk).textAlign : 'left';
  const amap = { left: 'justifyLeft', start: 'justifyLeft', center: 'justifyCenter', right: 'justifyRight', end: 'justifyRight', justify: 'justifyFull' };
  ['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'].forEach(c => document.querySelector(`[data-cmd="${c}"]`).setAttribute('aria-pressed', String(amap[align] === c)));
  lineSel.value = blk && blk.style.lineHeight && [...lineSel.options].some(o => o.value === blk.style.lineHeight) ? blk.style.lineHeight : '';
  const cell = el.closest && el.closest('td,th');
  $('#ctxTable').hidden = !(cell && ed.contains(cell));
}
document.addEventListener('selectionchange', () => { if (selInEditor()) { saveSel(); updateState(); } });

/* ============================================================
   Popovers and dialogs
   ============================================================ */
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; } }
function showPop(anchor, el) {
  closePop(); el.classList.add('pop'); document.body.appendChild(el); openPop = el;
  const a = anchor.getBoundingClientRect(); const w = el.offsetWidth;
  el.style.top = Math.round(a.bottom + 6) + 'px';
  el.style.left = Math.round(Math.max(8, Math.min(a.left, innerWidth - w - 8))) + 'px';
}
document.addEventListener('mousedown', e => { if (openPop && !openPop.contains(e.target) && !e.target.closest('#tableBtn,#saveMenuBtn')) closePop(); });

function dialog({ title, body, fields = [], okText = '확인', cancelText = '취소', danger = false }) {
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h2>${htmlEsc(title)}</h2>${body ? `<p>${htmlEsc(body)}</p>` : ''}` +
      fields.map((f, i) => `<label>${htmlEsc(f.label)}<input id="dlgField${i}" type="${f.type || 'text'}" value="${htmlEsc(f.value || '')}" placeholder="${htmlEsc(f.placeholder || '')}"></label>`).join('') +
      `<div class="actions"><button class="btn" type="button" data-a="cancel">${htmlEsc(cancelText)}</button><button class="btn primary" type="button" data-a="ok"${danger ? ' style="background:var(--danger);border-color:var(--danger)"' : ''}>${htmlEsc(okText)}</button></div>`;
    scrim.appendChild(d); document.body.appendChild(scrim);
    const done = ok => { scrim.remove(); resolve(ok ? fields.map((_, i) => $('#dlgField' + i, d).value) : null); };
    d.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (a) done(a.dataset.a === 'ok'); });
    scrim.addEventListener('mousedown', e => { if (e.target === scrim) done(false); });
    d.addEventListener('keydown', e => { if (e.key === 'Escape') done(false); if (e.key === 'Enter') done(true); });
    (d.querySelector('input') || d.querySelector('[data-a="ok"]')).focus();
  });
}

/* Table picker */
$('#tableBtn').addEventListener('click', e => {
  if (openPop) { closePop(); return; }
  saveSel();
  const el = document.createElement('div');
  el.innerHTML = '<div class="grid-picker"></div><div class="grid-label">표 크기를 고르세요</div>';
  const grid = el.firstChild, label = el.lastChild;
  for (let r = 1; r <= 8; r++) for (let c = 1; c <= 8; c++) {
    const s = document.createElement('span'); s.dataset.r = r; s.dataset.c = c; grid.appendChild(s);
  }
  grid.addEventListener('mouseover', ev => {
    const s = ev.target.closest('span'); if (!s) return;
    grid.querySelectorAll('span').forEach(x => x.classList.toggle('on', +x.dataset.r <= +s.dataset.r && +x.dataset.c <= +s.dataset.c));
    label.textContent = `${s.dataset.r}행 × ${s.dataset.c}열`;
  });
  grid.addEventListener('mousedown', ev => ev.preventDefault());
  grid.addEventListener('click', ev => {
    const s = ev.target.closest('span'); if (!s) return; closePop(); insertTable(+s.dataset.r, +s.dataset.c);
  });
  showPop(e.currentTarget, el);
});
function insertTable(rows, cols) {
  let h = '<table><tbody>';
  for (let r = 0; r < rows; r++) { h += '<tr>'; for (let c = 0; c < cols; c++) h += '<td><p><br></p></td>'; h += '</tr>'; }
  h += '</tbody></table><p><br></p>';
  exec('insertHTML', h);
}
function tableOp(op) {
  const r = savedRange; if (!r) return;
  const n = r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer;
  const cell = n.closest && n.closest('td,th'); if (!cell || !ed.contains(cell)) return;
  const tr = cell.parentNode, table = cell.closest('table'), idx = cell.cellIndex;
  const width = Math.max(...[...table.rows].map(row => [...row.cells].reduce((a, c) => a + (c.colSpan || 1), 0)));
  const newCell = () => { const td = document.createElement('td'); td.innerHTML = '<p><br></p>'; return td; };
  const newRow = () => { const row = document.createElement('tr'); for (let i = 0; i < width; i++) row.appendChild(newCell()); return row; };
  if (op === 'rowAbove') tr.before(newRow());
  if (op === 'rowBelow') tr.after(newRow());
  if (op === 'colLeft' || op === 'colRight') [...table.rows].forEach(row => {
    const ref = row.cells[Math.min(idx, row.cells.length - 1)];
    if (!ref) row.appendChild(newCell()); else if (op === 'colLeft') ref.before(newCell()); else ref.after(newCell());
  });
  if (op === 'delRow') { tr.remove(); if (!table.rows.length) table.remove(); }
  if (op === 'delCol') { [...table.rows].forEach(row => { if (row.cells[idx]) row.cells[idx].remove(); }); if (!table.rows[0] || !table.rows[0].cells.length) table.remove(); }
  if (op === 'delTable') table.remove();
  if (!ed.contains(table)) $('#ctxTable').hidden = true;
  onChange();
}
document.querySelectorAll('[data-tbl]').forEach(b => b.addEventListener('click', () => tableOp(b.dataset.tbl)));

/* Links */
async function linkFlow() {
  saveSel();
  const r = savedRange;
  const n = r && (r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer);
  const existing = n && n.closest && n.closest('a');
  const res = await dialog({ title: existing ? '링크 편집' : '링크 삽입', fields: [{ label: '주소', value: existing ? existing.getAttribute('href') : 'https://', placeholder: 'https://example.com' }], okText: existing ? '저장' : '삽입' });
  if (!res) { restoreSel(); return; }
  let url = res[0].trim();
  if (!url || url === 'https://') { if (existing) { existing.replaceWith(...existing.childNodes); onChange(); } return; }
  if (!/^(https?:|mailto:|#)/i.test(url)) url = 'https://' + url;
  if (existing) { existing.setAttribute('href', url); onChange(); return; }
  if (r && r.collapsed) exec('insertHTML', `<a href="${htmlEsc(url)}">${htmlEsc(url)}</a>`);
  else exec('createLink', url);
}
$('#linkBtn').addEventListener('click', linkFlow);
ed.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (a && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const w = document.createElement('a'); w.href = a.href; w.target = '_blank'; w.rel = 'noopener'; w.click(); }
});

/* ============================================================
   Find & replace
   ============================================================ */
const findPanel = $('#findPanel'), findText = $('#findText'), replaceText = $('#replaceText'), findCount = $('#findCount');
function openFind() { saveSel(); findPanel.hidden = false; const s = getSelection().toString(); if (s && s.length < 80) findText.value = s; findText.focus(); findText.select(); countMatches(); }
$('#findBtn').addEventListener('click', () => findPanel.hidden ? openFind() : (findPanel.hidden = true));
$('#findClose').addEventListener('click', () => { findPanel.hidden = true; restoreSel(); });
function textNodes() { const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); const a = []; while (w.nextNode()) a.push(w.currentNode); return a; }
function countMatches() {
  const q = findText.value; if (!q) { findCount.textContent = ''; return 0; }
  let n = 0; textNodes().forEach(t => { n += t.data.split(q).length - 1; });
  findCount.textContent = n ? `${n}개` : '없음'; return n;
}
findText.addEventListener('input', countMatches);
function findNext() {
  const q = findText.value; if (!q) return false;
  const nodes = textNodes(); if (!nodes.length) return false;
  const r = savedRange;
  let startIdx = 0, startOff = 0;
  if (r) { const i = nodes.indexOf(r.endContainer); if (i >= 0) { startIdx = i; startOff = r.endOffset; } }
  for (let k = 0; k <= nodes.length; k++) {
    const i = (startIdx + k) % nodes.length; const t = nodes[i];
    const from = k === 0 ? startOff : 0;
    const at = t.data.indexOf(q, from);
    if (at >= 0) {
      const nr = document.createRange(); nr.setStart(t, at); nr.setEnd(t, at + q.length);
      const s = getSelection(); s.removeAllRanges(); s.addRange(nr); savedRange = nr.cloneRange();
      (t.parentElement || ed).scrollIntoView({ block: 'center', behavior: 'smooth' });
      return true;
    }
  }
  toast('찾는 내용이 없습니다'); return false;
}
$('#findNext').addEventListener('click', findNext);
findText.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); findNext(); } if (e.key === 'Escape') findPanel.hidden = true; });
$('#replaceOne').addEventListener('click', () => {
  const q = findText.value; if (!q) return;
  const r = savedRange;
  if (r && r.toString() === q && ed.contains(r.commonAncestorContainer)) {
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('insertText', false, replaceText.value); saveSel(); onChange();
  }
  findNext(); countMatches();
});
$('#replaceAll').addEventListener('click', () => {
  const q = findText.value; if (!q) return;
  let n = 0;
  textNodes().forEach(t => { const parts = t.data.split(q); if (parts.length > 1) { n += parts.length - 1; t.data = parts.join(replaceText.value); } });
  onChange(); countMatches(); toast(n ? `${n}개를 바꿨습니다` : '찾는 내용이 없습니다');

    rows.forEach(tr => {
      const row = document.createElement('tr');
      const trPr = child(tr, 'trPr');
      let col = parseInt(attr(child(trPr, 'gridBefore'), 'val'), 10) || 0;
      const cells = [];
      kids(tr).forEach(e => { if (e.localName === 'tc') cells.push(e); else if (e.localName === 'sdt') kids(child(e, 'sdtContent')).forEach(x => x.localName === 'tc' && cells.push(x)); });
      cells.forEach(tc => {
        const tcPr = child(tc, 'tcPr');
        const span = parseInt(attr(child(tcPr, 'gridSpan'), 'val'), 10) || 1;
        const vm = child(tcPr, 'vMerge');
        if (vm && attr(vm, 'val') !== 'restart' && origin[col]) { origin[col].rowSpan += 1; col += span; return; }
        const td = document.createElement('td');
        if (span > 1) td.colSpan = span;
        const fill = attr(child(tcPr, 'shd'), 'fill'); if (fill && fill !== 'auto') td.style.backgroundColor = '#' + fill;
        const va = attr(child(tcPr, 'vAlign'), 'val'); if (va === 'center') td.style.verticalAlign = 'middle'; else if (va === 'bottom') td.style.verticalAlign = 'bottom';
        blocks(tc, td);
        if (!td.firstChild) td.innerHTML = '<p><br></p>';
        if (vm && attr(vm, 'val') === 'restart') origin[col] = td; else delete origin[col];
        row.appendChild(td); col += span;
      });
      (child(trPr, 'tblHeader') && !tbody.rows.length ? thead : tbody).appendChild(row);
    });
    if (thead.rows.length) t.appendChild(thead);
    t.appendChild(tbody);
    return t;
  }

  function blocks(container, out) {
    let stack = []; // [{ilvl, list, numId}]
    const pb = () => Object.assign(document.createElement('div'), { className: 'pb', contentEditable: 'false' });
    const handle = node => {
      switch (node.localName) {
        case 'p': {
          const r = paragraph(node);
          if (r.pageBefore) { stack = []; out.appendChild(pb()); if (r.empty && !r.listed && !r.pageAfter) return; }
          if (r.listed) {
            const info = listInfo(r.numId, r.ilvl);
            while (stack.length && stack[stack.length - 1].ilvl > r.ilvl) stack.pop();
            let top = stack[stack.length - 1];
            if (top && top.ilvl === r.ilvl && (top.numId !== r.numId || top.ordered !== info.ordered)) { stack.pop(); top = stack[stack.length - 1]; }
            if (!top || top.ilvl < r.ilvl) {
              const list = document.createElement(info.ordered ? 'ol' : 'ul');
              if (info.ordered && info.css !== 'decimal') list.style.listStyleType = info.css;
              if (info.ordered && info.start !== 1) list.setAttribute('start', info.start);
              const parentLi = top && top.list.lastElementChild;
              (parentLi || out).appendChild(list);
              top = { ilvl: r.ilvl, list, numId: r.numId, ordered: info.ordered }; stack.push(top);
            }
            const li = document.createElement('li');
            const el = r.el; if (el.style.textAlign) li.style.textAlign = el.style.textAlign; if (el.style.lineHeight) li.style.lineHeight = el.style.lineHeight;
            while (el.firstChild) li.appendChild(el.firstChild);
            top.list.appendChild(li);
          } else { stack = []; out.appendChild(r.el); }
          if (r.pageAfter) { stack = []; out.appendChild(pb()); }
          break;
        }
        case 'tbl': stack = []; out.appendChild(table(node)); break;
        case 'sdt': kids(child(node, 'sdtContent')).forEach(handle); break;
        case 'customXml': case 'ins': kids(node).forEach(handle); break;
      }
    };
    kids(container).forEach(handle);
  }

  const body = child(doc.documentElement, 'body');
  const out = document.createElement('div');
  blocks(body, out);
  // Drop a trailing empty paragraph Word adds after a final table or break.
  return out.innerHTML || '<p><br></p>';
}
function normalizePath(p) { const parts = []; p.split('/').forEach(s => { if (s === '..') parts.pop(); else if (s && s !== '.') parts.push(s); }); return parts.join('/'); }

/* ============================================================
   File handling
   ============================================================ */
function docName() { return ($('#docName').value || '제목 없는 문서').trim().replace(/[\\/:*?"<>|]+/g, '_'); }
async function offerFile(filename, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); toast(`${filename} 저장됨`); return; }
    catch (e) { if (e && e.code === 'declined') { toast('저장을 취소했습니다'); return; } if (e && e.code === 'rate_limited') { toast('잠시 후 다시 시도해 주세요'); return; } }
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`${filename} 저장됨`);
}
async function saveDocx() {
  try { const blob = await buildDocx(); await offerFile(docName() + '.docx', blob); }
  catch (e) { console.error(e); toast('Word 파일을 만드는 중 문제가 생겼습니다: ' + e.message, 4000); }
}
function exportHtml() {
  const clone = ed.cloneNode(true); clone.removeAttribute('contenteditable'); clone.removeAttribute('id');
  clone.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
  const html = `<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><title>${htmlEsc(docName())}</title><style>body{background:#f2f2f2;margin:0;padding:24px}.doc{background:#fff;margin:0 auto;width:210mm;padding:25.4mm;box-sizing:border-box}${DOC_CSS}</style></head><body>${clone.outerHTML}</body></html>`;
  offerFile(docName() + '.html', html);
}
function exportTxt() { offerFile(docName() + '.txt', ed.innerText.replace(/​/g, '')); }

$('#saveBtn').addEventListener('click', saveDocx);
$('#saveMenuBtn').addEventListener('click', e => {
  if (openPop) { closePop(); return; }
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<button type="button" role="menuitem" data-f="docx">Word 문서 (.docx)<small>Microsoft Word, 한컴오피스, LibreOffice에서 열림</small></button><button type="button" role="menuitem" data-f="html">웹 페이지 (.html)<small>서식을 유지한 HTML</small></button><button type="button" role="menuitem" data-f="txt">일반 텍스트 (.txt)<small>서식 없이 글자만</small></button>`;
  m.addEventListener('click', ev => { const b = ev.target.closest('[data-f]'); if (!b) return; closePop(); ({ docx: saveDocx, html: exportHtml, txt: exportTxt })[b.dataset.f](); });
  showPop(e.currentTarget, m);
  const r = m.getBoundingClientRect(); const a = e.currentTarget.getBoundingClientRect();
  m.style.left = Math.max(8, a.right - r.width) + 'px';
});

$('#openBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openFile(f); });
async function openFile(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  const base = f.name.replace(/\.[^.]+$/, '');
  try {
    let html;
    if (ext === 'docx' || ext === 'docm' || ext === 'dotx') html = await importDocx(await f.arrayBuffer());
    else if (ext === 'doc') { toast('이전 Word 형식(.doc)은 열 수 없습니다. Word에서 .docx로 저장한 뒤 열어 주세요.', 5000); return; }
    else if (ext === 'html' || ext === 'htm') html = sanitizeHtml(await f.text());
    else html = (await f.text()).replace(/\r\n?/g, '\n').split('\n').map(l => `<p>${l ? htmlEsc(l) : '<br>'}</p>`).join('');
    loadContent(html, base, false);
    toast(`${f.name} 열림`);
  } catch (err) {
    console.error(err);
    toast(`${f.name}을(를) 열 수 없습니다. 손상되었거나 지원하지 않는 형식입니다.`, 4500);
  }
}
const desk = $('#desk');
desk.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); desk.classList.add('dragover'); } });
desk.addEventListener('dragleave', e => { if (e.target === desk) desk.classList.remove('dragover'); });
desk.addEventListener('drop', e => {
  desk.classList.remove('dragover');
  const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return;
  e.preventDefault();
  if (f.type.startsWith('image/')) { const fr = new FileReader(); fr.onload = () => { ed.focus(); document.execCommand('insertHTML', false, `<img src="${fr.result}" alt="">`); onChange(); }; fr.readAsDataURL(f); }
  else openFile(f);
});

$('#newBtn').addEventListener('click', async () => {
  const ok = await dialog({ title: '새 문서를 시작할까요?', body: '지금 문서는 지워집니다. 필요하면 먼저 .docx로 저장하세요.', okText: '새 문서', danger: true });
  if (ok) { loadContent('<p><br></p>', '제목 없는 문서', false); ed.focus(); }
});

/* ============================================================
   Document state, autosave, status
   ============================================================ */
const STORE_KEY = 'gaon-word-draft-v1';
let isSample = false, saveTimer = null, statTimer = null;
function loadContent(html, name, sample) {
  ed.innerHTML = html; $('#docName').value = name; isSample = sample; $('#sampleChip').hidden = !sample;
  selectImage(null); $('#ctxTable').hidden = true; savedRange = null;
  ed.querySelectorAll('.pb').forEach(p => p.setAttribute('contenteditable', 'false'));
  updateStats(); if (!sample) persist();
  $('.desk').scrollTop = 0;
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ html: ed.innerHTML, name: $('#docName').value, at: Date.now() })); $('#stSaved').textContent = '이 브라우저에 자동 보관됨'; }
  catch (e) { $('#stSaved').textContent = '자동 보관을 사용할 수 없음'; }
}
function onChange() {
  if (isSample) { isSample = false; $('#sampleChip').hidden = true; }
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 700);
  clearTimeout(statTimer); statTimer = setTimeout(updateStats, 250);
}
ed.addEventListener('input', onChange);
$('#docName').addEventListener('input', onChange);
function updateStats() {
  const text = ed.innerText.replace(/​/g, '');
  const words = (text.match(/\S+/g) || []).length;
  const chars = text.replace(/\n/g, '').length;
  const pbs = ed.querySelectorAll('.pb').length;
  const pages = innerWidth > 860 ? Math.max(Math.ceil(ed.offsetHeight / PAGE_H_PX), pbs + 1) : pbs + 1;
  $('#stPages').textContent = `${pages}쪽`;
  $('#stWords').textContent = `${words.toLocaleString('ko-KR')} 단어`;
  $('#stChars').textContent = `${chars.toLocaleString('ko-KR')} 글자`;
}

/* Zoom */
let zoom = 1;
$('#zoomSel').addEventListener('change', e => { zoom = parseFloat(e.target.value); $('#zoomWrap').style.zoom = zoom; });

/* Keyboard */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') { closePop(); if (!findPanel.hidden) findPanel.hidden = true; }
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveDocx(); }
  else if (k === 'o') { e.preventDefault(); $('#fileInput').click(); }
  else if (k === 'f' || k === 'h') { e.preventDefault(); openFind(); }
  else if (k === 'k' && selInEditor()) { e.preventDefault(); linkFlow(); }
  else if (k === 'enter' && selInEditor()) { e.preventDefault(); saveSel(); insertPageBreak(); }
  else if (k === 'e' && selInEditor()) { e.preventDefault(); exec('justifyCenter'); }
  else if (k === 'l' && selInEditor()) { e.preventDefault(); exec('justifyLeft'); }
  else if (k === 'r' && selInEditor()) { e.preventDefault(); exec('justifyRight'); }
  else if (k === 'j' && selInEditor()) { e.preventDefault(); exec('justifyFull'); }
});
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault(); saveSel();
    const r = selInEditor(); const n = r && (r.startContainer.nodeType === 3 ? r.startContainer.parentNode : r.startContainer);
    if (n && n.closest && n.closest('li')) indentBlocks(!e.shiftKey);
    else if (e.shiftKey) indentBlocks(false);
    else { document.execCommand('insertText', false, '\t'); onChange(); }
  }
  if ((e.key === 'Backspace' || e.key === 'Delete') && selectedImg) { e.preventDefault(); selectedImg.remove(); selectImage(null); onChange(); }
});
